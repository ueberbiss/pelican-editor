'use strict';

// <pure>
const KEY_RE = /^ {0,3}([\p{L}\p{N}_-]+):[ \t]*(.*)$/u;
const CONT_RE = /^(?: {4}|\t)/;

// Splits text into frontmatter fields and body (Pelican/python-markdown meta rules).
function parse(text) {
  const lines = text.split('\n');
  const fields = [];
  let i = 0;
  for (; i < lines.length; i++) {
    const line = lines[i];
    if (line.trim() === '') break;
    const m = KEY_RE.exec(line);
    if (m) { fields.push({ key: m[1], value: m[2].trimEnd() }); continue; }
    if (CONT_RE.test(line) && fields.length) {
      fields[fields.length - 1].value += '\n' + line.trim();
      continue;
    }
    break;

  let bodyLine = 0, stray = null;
  if (fields.length) {
    bodyLine = (i < lines.length && lines[i].trim() === '') ? i + 1 : i;
    // a non-blank line that ended the header: it is body text now, which is easy to miss
    if (i < lines.length && lines[i].trim() !== '') stray = { line: i + 1, text: lines[i] };
  }
  return { fields, body: lines.slice(bodyLine).join('\n'), stray };

function serialize(fields, body) {
  if (!fields.length) {
    // keep a body that starts with "foo: bar" from turning into a field
    return KEY_RE.test(body.split('\n')[0]) ? '\n' + body : body;

  const head = fields.map(f => {
    const parts = f.value.trimEnd().split('\n');
    let s = f.key + ':' + (parts[0] ? ' ' + parts[0] : '');
    for (let k = 1; k < parts.length; k++) s += '\n    ' + parts[k];

function slugify(s) {

// ---------- Markdown -> node tree (for the preview; follows Python-Markdown, which Pelican uses) ----------
// Output is plain data. The UI turns it into DOM with createElement/textContent only, never innerHTML.
// Raw HTML in the text is shown literally. Limits keep hostile input from stalling the page.
const MD_MAX_CHARS = 300000, MD_MAX_INLINE = 8000, MD_MAX_DEPTH = 8;
const MD_ESC = '\\`*_{}[]()#+-.!~|<>';
const MD_HR = /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/;
const MD_LI = /^ {0,3}([*+-]|\d{1,9}[.)])[ \t]+(.*)$/;
const MD_IND = /^(?: {4}|\t)/;

// Only http(s) and mailto links are clickable. Relative links, "{filename}/x", anchors and
// everything else (javascript:, data:, ...) stay inert text. Returns null for those.
function mdSafeUrl(u) {
  let s = ''; // drop whitespace, control and invisible characters that browsers ignore inside a scheme
  for (const ch of String(u)) {
    const c = ch.codePointAt(0);
    if (!(c <= 0x20 || (c >= 0x7f && c <= 0x9f) || (c >= 0x200b && c <= 0x200f) || c === 0x2028 || c === 0x2029 || c === 0xfeff)) s += ch;
  }

  return m && /^(?:https?|mailto)$/i.test(m[1]) ? s : null;

function mdBracketEnd(s, open) {
  let depth = 0;
  for (let k = open; k < s.length; k++) {
    const c = s[k];
    if (c === '\\') k++;
    else if (c === '[') depth++;
    else if (c === ']' && --depth === 0) return k;

function mdLinkDest(s, p) {
  if (s[p] !== '(') return null;
  let k = p + 1;

    const e = s.indexOf('>', k);

    let depth = 0;
    for (; k < s.length; k++) {

      if (c === '(') depth++;

      href += c;

    const e = s.indexOf(q, k + 1);
    if (e < 0) return null;
    title = s.slice(k + 1, e); k = e + 1;
    while (/\s/.test(s[k] || '')) k++;

// Closing delimiter for emphasis: returns the index where the closing marker starts, or -1.

  const c = m[0], L = m.length;

    const ch = s[k];

      k = e > 0 ? e + (j - k) - 1 : j - 1;
      continue;
    }
    if (ch !== c) continue;
    let e = k; while (s[e] === c) e++;

    if (ok && !(c === '_' && mdIsAlnum(s[e]))) return e - L;
    k = e - 1;
  }

  if (s.length > MD_MAX_INLINE) return [{ t: 'text', v: s }];
  return mdInl(s, refs || {}, 0);

function mdInl(s, refs, depth) {
  const out = [], failed = {}, n = s.length;

  const flush = () => { if (buf) { out.push({ t: 'text', v: buf }); buf = ''; } };
  const sub = (str) => depth < MD_MAX_DEPTH ? mdInl(str, refs, depth + 1) : [{ t: 'text', v: str }];

    const c = s[i];
    if (c === '\\' && i + 1 < n && MD_ESC.includes(s[i + 1])) { buf += s[i + 1]; i += 2; continue; }
    if (c === '\n') {
      if (buf.endsWith('  ')) { buf = buf.trimEnd(); flush(); out.push({ t: 'br' }); } else buf += '\n';
      i++; continue;
    }
    if (c === '`') {

      else { buf += tick; i = j; }

        const dest = mdLinkDest(s, close + 1);

          if (ref) { href = ref.href; title = ref.title; end = close + 1 + (m2 ? m2[0].length : 0); }

        if (end > 0) {
          flush();
          if (img) out.push({ t: 'img', alt: label.replace(/\\(.)/g, '$1'), src: href, title });

        }

      }
      const lit = m || c;
      buf += lit; i += lit.length; continue;
    }
    buf += c; i++;
  }

  return out;

    if (s[k] === '\\' && s[k + 1] === '|') { cur += '|'; k++; }
    else if (s[k] === '|') { cells.push(cur.trim()); cur = ''; }
    else cur += s[k];

  const plus = document.createElement('button');
  plus.id = 'tab-new'; plus.className = 'icon'; plus.textContent = '+'; plus.title = tr('newTab');
  nav.append(plus);
}
function addDoc(text, h, n) {
  stash();
  const t = text.replace(/^﻿/, '').replace(/\r\n/g, '\n');
  const d = newDoc({ handle: h, eol: text.includes('\r\n') ? '\r\n' : '\n', fname: n, text: t, savedText: t, hist: [t] });
  const cur = docs[active];
  if (docs.length === 1 && cur && !cur.handle && cur.text === '' && cur.savedText === '') {
    docs = [d]; active = -1; activate(0); // replace the untouched empty tab
  } else {
    docs.push(d); activate(docs.length - 1);
  }
}
async function openHandle(h) {
  stash();
  for (let i = 0; i < docs.length; i++) {
    try { if (docs[i].handle && await docs[i].handle.isSameEntry(h)) { activate(i); return; } } catch (e) { /* ignore */ }
  }
  const f = await h.getFile();
  addDoc(await f.text(), h, f.name);
}
function closeDoc(i) {
  stash();
  const d = docs[i];
  if (d.text !== d.savedText && !confirm(tr('confirmClose', { name: d.fname }))) return;
  docs.splice(i, 1);
  if (!docs.length) { docs.push(newDoc()); active = -1; activate(0); return; }
  if (i === active) { active = -1; activate(Math.min(i, docs.length - 1)); }
  else { if (i < active) active--; renderTabs(); }
}
function toOut() {
  const t = ed.value;
  return eol === '\r\n' ? t.replace(/\n/g, '\r\n') : t;
}
async function writeTo(h) {
  const w = await h.createWritable();
  await w.write(toOut());
  await w.close();
}
function download() {
  const url = URL.createObjectURL(new Blob([toOut()], { type: 'text/markdown;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = fname;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  markSaved(); say(tr('downloaded'));
}

async function openFile() {
  if (!hasFS) { $('fallback-input').click(); return; }
  try {
    const hs = await window.showOpenFilePicker({ types: [MDTYPE], multiple: true });
    for (const h of hs) await openHandle(h);
  } catch (e) { if (e.name !== 'AbortError') say(tr('openFailed') + e.message, true); }
}
async function saveAs() {
  if (!hasFS) { download(); return; }
  try {
    const h = await window.showSaveFilePicker({ suggestedName: fname, types: [MDTYPE] });
    await writeTo(h);
    handle = h; fname = h.name; markSaved(); say(tr('saved'));
    refreshDocDir();
  } catch (e) { if (e.name !== 'AbortError') say(tr('saveFailed') + e.message, true); }
}
async function save() {
  if (!hasFS) { download(); return; }
  if (!handle) { await saveAs(); return; }
  try { await writeTo(handle); markSaved(); say(tr('saved')); }
  catch (e) { say(tr('saveFailed') + e.message, true); }
}
function newFile() {
  stash();
  docs.push(newDoc());
  activate(docs.length - 1);
}

$('btn-new').addEventListener('click', newFile);
$('btn-open').addEventListener('click', openFile);
$('btn-save').addEventListener('click', save);
$('btn-saveas').addEventListener('click', saveAs);
$('fallback-input').addEventListener('change', async e => {
  const files = [...e.target.files];
  e.target.value = '';
  for (const f of files) addDoc(await f.text(), null, f.name);
});
$('tabs').addEventListener('click', e => {
  const c = e.target.closest('[data-close]');
  if (c) { closeDoc(+c.dataset.close); return; }
  if (e.target.closest('#tab-new')) { newFile(); return; }
  const t = e.target.closest('.tab');
  if (t && +t.dataset.i !== active) activate(+t.dataset.i);
});
$('tabs').addEventListener('auxclick', e => {
  const t = e.button === 1 && e.target.closest('.tab');
  if (t) { e.preventDefault(); closeDoc(+t.dataset.i); }
});

$('btn-undo').addEventListener('click', undo);
$('btn-redo').addEventListener('click', redo);
// route browser-native undo/redo (menu, shortcuts) to our history
document.addEventListener('beforeinput', e => {
  if (e.inputType === 'historyUndo') { e.preventDefault(); undo(); }
  else if (e.inputType === 'historyRedo') { e.preventDefault(); redo(); }
}, true);
window.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); redo(); }
});
window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'o') { e.preventDefault(); openFile(); }
});
window.addEventListener('beforeunload', e => {
  stash();
  if (docs.some(d => d.text !== d.savedText)) { e.preventDefault(); e.returnValue = ''; }
});

// drag & drop (handle must be requested synchronously)
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', async e => {
  e.preventDefault();
  const items = [...(e.dataTransfer.items || [])].filter(it => it.kind === 'file');
  const hps = items.map(it => it.getAsFileSystemHandle ? it.getAsFileSystemHandle() : null);
  const files = [...e.dataTransfer.files];
  for (let i = 0; i < files.length; i++) {
    try {
      const h = hps[i] ? await hps[i] : null;
      if (h && h.kind === 'directory') continue;
      if (h && h.kind === 'file') await openHandle(h);
      else await addDoc(await files[i].text(), null, files[i].name);
    } catch (err) { say(tr('openFailed') + err.message, true); }
  }
});

// ---------- formatting toolbar ----------
// Formatting only ever touches the body: the selection is clamped to the start of the body.
function sel() {
  const off = ed.value.length - body.length;
  return { v: ed.value, off, s: Math.max(ed.selectionStart, off), e: Math.max(ed.selectionEnd, off) };
}
function applyEdit(v, s, e) {
  ed.value = v; ed.focus(); ed.setSelectionRange(s, e);
  editorChanged('struct'); // own undo step per formatting action
}
function lineRange(v, s, e, off) {
  const a = Math.max(s === 0 ? 0 : v.lastIndexOf('\n', s - 1) + 1, off);
  const b = (e > s && v[e - 1] === '\n') ? e - 1 : e;
  let c = v.indexOf('\n', b);
  if (c < 0) c = v.length;
  return [a, c];
}
function fmtWrap(pre, suf, ph) {
  let { v, off, s, e } = sel();
  if (s === e) {
    applyEdit(v.slice(0, s) + pre + ph + suf + v.slice(e), s + pre.length, s + pre.length + ph.length);
    return;
  }
  while (s < e && /\s/.test(v[s])) s++;      // keep spaces outside the markers
  while (e > s && /\s/.test(v[e - 1])) e--;
  if (s === e) return;
  const inner = v.slice(s, e);
  if (s - pre.length >= off && v.slice(s - pre.length, s) === pre && v.slice(e, e + suf.length) === suf) {
    // markers sit right outside the selection: toggle off
    applyEdit(v.slice(0, s - pre.length) + inner + v.slice(e + suf.length), s - pre.length, e - pre.length);
  } else if (inner.length >= pre.length + suf.length && inner.startsWith(pre) && inner.endsWith(suf)) {
    // markers are part of the selection: toggle off
    const n = inner.slice(pre.length, inner.length - suf.length);
    applyEdit(v.slice(0, s) + n + v.slice(e), s, s + n.length);
  } else {
    applyEdit(v.slice(0, s) + pre + inner + suf + v.slice(e), s + pre.length, s + pre.length + inner.length);
  }
}
function fmtLines(kind) {
  const { v, off, s, e } = sel();
  const [a, c] = lineRange(v, s, e, off);
  const lines = v.slice(a, c).split('\n');
  const multi = lines.length > 1;
  const targets = lines.map((l, i) => i).filter(i => !multi || lines[i].trim() !== '');
  const HEAD = /^#{1,6}[ \t]+/, UL = /^[-*+][ \t]+/, OL = /^\d+\.[ \t]+/, Q = /^>[ \t]?/;
  const out = lines.slice();
  if (kind[0] === 'h') {
    const pre = '#'.repeat(+kind[1]) + ' ';
    const on = targets.every(i => lines[i].startsWith(pre));
    targets.forEach(i => { const base = lines[i].replace(HEAD, ''); out[i] = on ? base : pre + base; });
  } else if (kind === 'ul' || kind === 'ol') {
    const re = kind === 'ul' ? UL : OL;
    const on = targets.every(i => re.test(lines[i]));
    let n = 1;
    targets.forEach(i => {
      const base = lines[i].replace(UL, '').replace(OL, '');
      out[i] = on ? base : (kind === 'ul' ? '- ' : (n++) + '. ') + base;
    });
  } else {
    const on = targets.every(i => Q.test(lines[i]));
    targets.forEach(i => { out[i] = on ? lines[i].replace(Q, '') : '> ' + lines[i]; });
  }
  const block = out.join('\n');
  applyEdit(v.slice(0, a) + block + v.slice(c), a, a + block.length);
}
function fmtCodeBlock() {
  const { v, off, s, e } = sel();
  if (s === e) {
    const lead = (s === off || v[s - 1] === '\n') ? '' : '\n';
    const pos = s + lead.length + 4;
    applyEdit(v.slice(0, s) + lead + '```\n\n```' + v.slice(e), pos, pos);
    return;
  }
  const [a, c] = lineRange(v, s, e, off);
  const block = '```\n' + v.slice(a, c) + '\n```';
  applyEdit(v.slice(0, a) + block + v.slice(c), a, a + block.length);
}
function fmtLink() {
  const { v, s, e } = sel();
  const txt = v.slice(s, e);
  if (/^https?:\/\/\S+$/.test(txt)) { // selected text is a URL: use it as the target
    const ph = tr('phText');
    applyEdit(v.slice(0, s) + '[' + ph + '](' + txt + ')' + v.slice(e), s + 1, s + 1 + ph.length);
    return;
  }
  const label = txt || tr('phText');
  const us = s + label.length + 3;
  applyEdit(v.slice(0, s) + '[' + label + '](https://)' + v.slice(e), us, us + 8);
}
function fmtImage() {
  if (media.root && !media.needsPermission && 'showOpenFilePicker' in window) {
    pickImages().catch(err => { if (err.name !== 'AbortError') say(tr('openFailed') + err.message, true); });
    return;
  }
  const { v, s, e } = sel();
  const hasSel = s !== e;
  const alt = hasSel ? v.slice(s, e) : tr('phAlt');
  const ins = '![' + alt + ']({static}/images/)';
  const caret = s + ins.length - 1;
  applyEdit(v.slice(0, s) + ins + v.slice(e), hasSel ? caret : s + 2, hasSel ? caret : s + 2 + alt.length);
}
const ACTIONS = {
  bold: () => fmtWrap('**', '**', tr('phText')),
  italic: () => fmtWrap('_', '_', tr('phText')),
  strike: () => fmtWrap('~~', '~~', tr('phText')),
  h1: () => fmtLines('h1'), h2: () => fmtLines('h2'), h3: () => fmtLines('h3'),
  ul: () => fmtLines('ul'), ol: () => fmtLines('ol'), quote: () => fmtLines('quote'),
  code: () => fmtWrap('`', '`', tr('phText')),
  codeblock: fmtCodeBlock, link: fmtLink, image: fmtImage
};
$('toolbar').addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
$('toolbar').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (b) ACTIONS[b.dataset.act]();
});
window.addEventListener('keydown', e => {
  if (document.activeElement !== ed || !(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey) return;
  const act = { b: 'bold', i: 'italic', k: 'link' }[e.key.toLowerCase()];
  if (act) { e.preventDefault(); ACTIONS[act](); }
});

// ---------- init ----------
$('lc').checked = lsGet('pme.lc') === '1';
$('lc').addEventListener('change', () => lsSet('pme.lc', $('lc').checked ? '1' : '0'));
if (!hasFS) $('banner').hidden = false;
function fillLangSelect() {
  const sel = $('ui-lang');
  sel.textContent = '';
  Object.keys(I18N).forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = I18N[c].langName || c;
    sel.append(o);
  });
  const load = document.createElement('option');
  load.value = '__load'; load.textContent = tr('loadLang');
  sel.append(load);
  sel.value = uiLang;
}
$('ui-lang').addEventListener('change', e => {
  if (e.target.value === '__load') { e.target.value = uiLang; $('pack-input').click(); return; }
  uiLang = e.target.value; lsSet('pme.lang', uiLang); applyLang();
});
$('pack-input').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const flat = flattenPack(JSON.parse(await f.text()));
    if (!Object.keys(flat).length) throw new Error('empty');
    const guess = (f.name.replace(/\.json$/i, '').match(/(?:^|[._-])([a-z]{2,3}(?:[-_][A-Za-z0-9]{2,8})?)$/i) || [])[1] || '';
    let code = (prompt(tr('packCodePrompt'), guess) || '').trim().replace('_', '-');
    if (!LANG_CODE_RE.test(code)) return;
    const parts = code.split('-');
    code = parts[0].toLowerCase() + (parts[1] ? '-' + (parts[1].length === 2 ? parts[1].toUpperCase() : parts[1]) : '');
    let packs = {};
    try { packs = JSON.parse(lsGet(PACK_KEY) || '{}'); } catch (err) { packs = {}; }
    packs[code] = flat;
    lsSet(PACK_KEY, JSON.stringify(packs));
    I18N[code] = Object.assign({}, I18N[code] || {}, flat);
    uiLang = code; lsSet('pme.lang', code);
    applyLang();
    say(tr('packLoaded', { lang: I18N[code].langName || code }));
  } catch (err) { say(tr('packInvalid'), true); }
});
$('btn-preview').addEventListener('click', () => setPreview(!prevOn));
$('btn-media').addEventListener('click', pickMedia);
$('btn-media-off').addEventListener('click', mediaOff);
$('btn-img-dir').addEventListener('click', pickImgDir);
$('media-dir').addEventListener('change', e => {
  media.contentPath = mdSplitDir(e.target.value.trim() || 'content');
  if (!e.target.value.trim()) e.target.value = 'content';
  clearMediaCache(); mediaSave(); afterMedia();
});
docs = [newDoc()];
activate(0);
applyLang();
setPreview(prevOn);
restoreMedia();
})();
</script>
